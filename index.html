<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТУРИКИ | Главная</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; border: 2px solid #9d00ff; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px #9d00ff; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        
        /* Логотип теперь кликабельный для админа */
        h1 { color: #00ffcc; margin: 0; text-shadow: 0 0 5px #00ffcc; cursor: pointer; }
        
        /* Кнопка Юзера */
        .user-btn { background: transparent; color: #aaa; border: 1px solid #aaa; padding: 8px 15px; cursor: pointer; font-weight: bold; text-decoration: none; border-radius: 5px;}
        .user-btn.logged-in { background: #00ffcc; color: #000; border-color: #00ffcc; }
        
        #admin-panel { display: none; margin-bottom: 20px; background: #2a2a2a; padding: 15px; border-radius: 5px; border-left: 5px solid #ff0055; }
        .add-btn { background: #ff0055; color: white; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%;}
        #create-form { display: none; margin-top: 15px; }
        #create-form input { width: 100%; padding: 10px; margin-bottom: 10px; background: #121212; color: white; border: 1px solid #555; box-sizing: border-box; }
        .save-btn { background: #00ffcc; color: black; border: none; padding: 10px; width: 100%; cursor: pointer; font-weight: bold;}
        
        .tourney-card { background: #1e1e1e; border-left: 5px solid #00ffcc; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .enter-btn { background: #9d00ff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 3px; font-weight: bold; text-decoration: none;}
    </style>
</head>
<body>

<div class="container">
    <header>
        <!-- СЕКРЕТНЫЙ ВХОД АДМИНА ТУТ -->
        <h1 onclick="checkLogin()" title="Секретный вход">ТУРИКИ</h1>
        
        <!-- КНОПКА ЮЗЕРА (Текст меняется скриптом) -->
        <a href="auth.html" id="header-user-btn" class="user-btn">👤 ВОЙТИ</a>
    </header>

    <div id="admin-panel">
        <button class="add-btn" onclick="toggleForm()">+ СОЗДАТЬ ТУРНИР</button>
        <div id="create-form">
            <input type="text" id="game-name" placeholder="Название игры (напр. CS2)">
            <input type="text" id="game-format" placeholder="Формат (напр. 1v1 или Спидран)">
            <input type="text" id="prize" placeholder="Призовые (напр. 5000 руб)">
            <button class="save-btn" onclick="createTournament()">ОПУБЛИКОВАТЬ В БАЗУ</button>
        </div>
    </div>

    <h2 style="color: #ffcc00;">Открытые турниры:</h2>
    <div id="tournament-list">
        <p style="color: #aaa;">⏳ Загрузка турниров с сервера...</p>
    </div>
</div>

<script>
    const dbUrl = "https://retro-cup-51db5-default-rtdb.firebaseio.com/tournaments.json";
    
    // ПРОВЕРКА: ВОШЕЛ ЛИ ИГРОК?
    let currentUser = localStorage.getItem("currentUser");

    // НАСТРОЙКА ИНТЕРФЕЙСА ПРИ ЗАГРУЗКЕ
    function checkUserSession() {
        let userBtn = document.getElementById("header-user-btn");
        if (currentUser) {
            userBtn.innerText = "👤 " + currentUser; // Пишем его ник
            userBtn.href = "profile.html"; // Направляем в профиль
            userBtn.classList.add("logged-in"); // Делаем кнопку неоновой
        }
    }
    checkUserSession();

    // СЕКРЕТНЫЙ ВХОД АДМИНА
    function checkLogin() {
        let password = prompt("Введите пароль админа:");
        if (password === "boss") {
            document.getElementById("admin-panel").style.display = "block"; 
        }
    }

    function toggleForm() {
        let form = document.getElementById("create-form");
        form.style.display = form.style.display === "block" ? "none" : "block";
    }

    async function loadTournaments() {
        try {
            let response = await fetch(dbUrl);
            let data = await response.json();
            let list = document.getElementById("tournament-list");
            
            list.innerHTML = ""; 

            // Если игрок вошел - кнопка ведет в профиль. Если нет - на страницу авторизации!
            let targetLink = currentUser ? "profile.html" : "auth.html";

            list.innerHTML += `
                <div class="tourney-card" style="border-left-color: #ff0055;">
                    <div>
                        <h2 style="margin: 0 0 5px 0; font-size: 20px;">СПИДРАН: Misery</h2>
                        <p style="margin: 0; color: #aaa; font-size: 14px;">Приручить домового | Призовые: Уважение</p>
                    </div>
                    <a href="${targetLink}" class="enter-btn" style="background: #ff0055;">Участвовать</a>
                </div>
            `;

            if (data) {
                let keys = Object.keys(data).reverse(); 
                keys.forEach(key => {
                    let t = data[key];
                    list.innerHTML += `
                        <div class="tourney-card">
                            <div>
                                <h2 style="margin: 0 0 5px 0; font-size: 20px;">${t.game} | ${t.format}</h2>
                                <p style="margin: 0; color: #aaa; font-size: 14px;">Призовые: ${t.prize}</p>
                            </div>
                            <a href="${targetLink}" class="enter-btn">Зайти</a>
                        </div>
                    `;
                });
            }
        } catch(error) {
            console.log("Ошибка сервера:", error);
        }
    }

    async function createTournament() {
        let game = document.getElementById("game-name").value;
        let format = document.getElementById("game-format").value;
        let prize = document.getElementById("prize").value;
        if (game === "" || format === "") return alert("Заполни данные!");
        
        let newTourney = { game: game, format: format, prize: prize };
        document.querySelector(".save-btn").innerText = "ОТПРАВКА...";
        await fetch(dbUrl, { method: "POST", body: JSON.stringify(newTourney) });
        
        document.getElementById("game-name").value = "";
        document.getElementById("game-format").value = "";
        document.getElementById("prize").value = "";
        document.querySelector(".save-btn").innerText = "ОПУБЛИКОВАТЬ В БАЗУ";
        toggleForm();
        loadTournaments();
    }

    loadTournaments();
</script>

</body>
</html>
