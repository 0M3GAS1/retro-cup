<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cup | Главная</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        body { background-color: #0b0b0e; color: #e0e0e0; font-family: 'Inter', sans-serif; margin: 0; padding: 20px; padding-bottom: 120px; }
        .container { max-width: 800px; margin: 0 auto; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; flex-wrap: wrap; gap: 15px; }
        .logo { font-family: 'Orbitron', sans-serif; color: #ffffff; margin: 0; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(166, 124, 255, 0.5); }
        
        .header-controls { display: flex; align-items: center; gap: 15px; }
        .user-btn { background: #141419; color: #8c8c9b; border: 1px solid #2a2a35; padding: 10px 20px; cursor: pointer; border-radius: 8px; font-weight: bold; text-decoration: none; transition: 0.3s; }
        .user-btn.logged-in { background: rgba(166, 124, 255, 0.1); color: #a67cff; border-color: #a67cff; }

        .section-title { font-size: 22px; color: #ffffff; margin-bottom: 20px; font-weight: 900;}
        #tournament-list { display: flex; flex-direction: column; gap: 15px; }
        
        .tourney-card { background: #141419; padding: 20px; border-radius: 12px; border: 1px solid #1f1f26; border-left: 5px solid #a67cff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: fadeIn 0.4s ease-out; flex-wrap: wrap; gap: 15px;}
        .tourney-info h2 { margin: 0 0 5px 0; font-size: 18px; color: white; }
        .tourney-info p { margin: 0 0 5px 0; color: #8c8c9b; font-size: 14px; }
        .author-tag { display: inline-block; background: #1e1e26; padding: 3px 8px; border-radius: 5px; font-size: 11px; color: #aaa;}
        .author-tag.admin { color: #ffcc00; font-weight: bold; background: rgba(255, 204, 0, 0.1); border: 1px solid #ffcc00; }

        /* ИСПРАВЛЕННЫЕ КНОПКИ (ДЛЯ ТЕЛЕФОНА) */
        .action-area { display: flex; gap: 10px; align-items: center; }
        .enter-btn { background: #23232b; color: white; border: 1px solid #33333d; padding: 10px 20px; border-radius: 8px; font-weight: bold; text-decoration: none; transition: 0.3s; }
        .enter-btn:hover { background: #a67cff; border-color: #a67cff; }
        .del-tourney-btn { background: rgba(255, 60, 100, 0.1); color: #ff3c64; border: 1px solid #ff3c64; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .del-tourney-btn:hover { background: #ff3c64; color: white; }

        .empty-state-btn { background: transparent; border: 2px dashed #33333d; border-radius: 12px; padding: 40px; text-align: center; color: #8c8c9b; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: fadeIn 0.5s ease-out; }
        .empty-state-btn:hover { border-color: white; color: white; background: rgba(255,255,255,0.02); }
        .empty-state-btn .big-plus { font-size: 32px; width: 50px; height: 50px; border: 2px solid; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        /* ПЛАВАЮЩИЕ КНОПКИ */
        .fab { position: fixed; bottom: 20px; padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; gap: 10px; cursor: pointer; z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.8); transition: 0.3s; font-weight: bold; }
        .fab-user { right: 20px; background: #141419; border: 2px solid #33333d; color: #8c8c9b; }
        .fab-admin { left: 20px; background: rgba(255, 60, 100, 0.1); border: 2px solid #ff3c64; color: #ff3c64; display: none;}

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; overflow-y: auto; padding: 20px 0;}
        .modal-box { background: #141419; padding: 25px; border-radius: 12px; border: 1px solid #2a2a35; width: 90%; max-width: 400px; margin: auto; }
        
        .modal-input, select.modal-input, textarea.modal-input { width: 100%; padding: 12px; margin-bottom: 12px; background: #0b0b0e; color: white; border: 1px solid #333; border-radius: 8px; box-sizing: border-box; font-size: 14px; outline: none; font-family: 'Inter', sans-serif;}
        select.modal-input { cursor: pointer; }
        textarea.modal-input { resize: vertical; min-height: 80px; }
        
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px;}
        .btn-save { flex: 1; background: white; color: black; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .btn-cancel { flex: 1; background: transparent; color: #8c8c9b; border: 1px solid #333; padding: 10px; border-radius: 6px; cursor: pointer;}
        
        .row-2 { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">Retro Cup</div>
        <div class="header-controls">
            <a href="auth.html" id="header-user-btn" class="user-btn">Войти в профиль</a>
        </div>
    </header>

    <div class="section-title">Ближайшие турниры</div>
    <div id="tournament-list">
        <p style="color: #8c8c9b;">⏳ Синхронизация с сервером...</p>
    </div>
</div>

<div class="fab fab-user" onclick="openProposeModal()" id="fab-user-btn" style="display: none;">
    <span style="font-size: 20px;">+</span> <span>Создать турнир</span>
</div>

<div class="fab fab-admin" onclick="window.location.href='profile.html'" id="fab-admin-btn">
    👑 Панель Админа
</div>

<!-- МОДАЛКА: СОЗДАНИЕ ТУРНИРА (НОВЫЕ ПОЛЯ) -->
<div class="modal-overlay" id="proposeModal">
    <div class="modal-box">
        <h3 style="margin-top:0; color:white;">Настройки турнира</h3>
        
        <input type="text" id="prop-name" class="modal-input" placeholder="Название (Напр: Зимний Кубок)">
        
        <div class="row-2">
            <!-- СТРОГИЙ ВЫБОР ИГРЫ -->
            <select id="prop-game" class="modal-input" style="flex: 1;">
                <option value="CS 2">CS 2</option>
                <option value="Dota 2">Dota 2</option>
            </select>
            
            <!-- СТРОГИЙ ВЫБОР ФОРМАТА КОМАНДЫ -->
            <select id="prop-format" class="modal-input" style="flex: 1;">
                <option value="1v1">1 vs 1</option>
                <option value="2v2">2 vs 2</option>
                <option value="5v5">5 vs 5</option>
            </select>
        </div>

        <!-- СИСТЕМА ТУРНИРА -->
        <select id="prop-system" class="modal-input">
            <option value="Single Elimination">На вылет (Single Elimination)</option>
            <option value="Double Elimination">Двойная сетка (Double Elim)</option>
            <option value="Группы + Плей-офф">Группы + Плей-офф (Как на ЧМ)</option>
            <option value="Спидран">Спидран (На время)</option>
        </select>
        
        <input type="text" id="prop-prize" class="modal-input" placeholder="Призовые (Напр: 5000 руб)">
        <textarea id="prop-rules" class="modal-input" placeholder="Описание и правила (Минимум 30 символов)..."></textarea>

        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeProposeModal()">Отмена</button>
            <button class="btn-save" onclick="sendTourneyProposal()" id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<script>
    const dbBase = "https://retro-cup-51db5-default-rtdb.firebaseio.com/";
    let currentUser = localStorage.getItem("currentUser");
    let lastTournamentsData = ""; 

    function checkUserSession() {
        if (currentUser) {
            let uBtn = document.getElementById("header-user-btn");
            uBtn.innerText = "👤 " + currentUser;
            uBtn.href = "profile.html";
            uBtn.classList.add("logged-in");
            document.getElementById("fab-user-btn").style.display = "flex";
            if (currentUser === "0m3gas") document.getElementById("fab-admin-btn").style.display = "flex";
        }
    }
    checkUserSession();

    // --- ТУРНИРЫ ---
    async function loadTournaments() {
        try {
            let response = await fetch(dbBase + "tournaments.json");
            let data = await response.json();
            
            let currentDataString = JSON.stringify(data);
            if (currentDataString === lastTournamentsData) return;
            lastTournamentsData = currentDataString;

            let list = document.getElementById("tournament-list");
            list.innerHTML = ""; 
            
            if (!data) {
                list.innerHTML = `<div class="empty-state-btn" onclick="${currentUser ? 'openProposeModal()' : 'window.location.href=\'auth.html\''}"><div class="big-plus">+</div><div style="font-size: 18px; font-weight: bold; color: white;">Турниров пока нет</div></div>`;
                return;
            }

            let keys = Object.keys(data).reverse(); 

            keys.forEach(key => {
                let t = data[key];
                let targetLink = currentUser ? "tournament.html?id=" + key : "auth.html";
                
                let authorDisplay = (t.author === "0m3gas") ? `<span class="author-tag admin">👑 Retro Cup</span>` : `<span class="author-tag">Орг: ${t.author || "Аноним"}</span>`;
                
                // РИСУЕМ КНОПКИ СПРАВА
                let actionButtons = `<a href="${targetLink}" class="enter-btn">К турниру</a>`;
                
                // Если админ - добавляем крестик РЯДОМ, а не скрыто
                if (currentUser === "0m3gas") {
                    actionButtons += `<button class="del-tourney-btn" onclick="deleteTourney('${key}')" title="Удалить">✖</button>`;
                }

                list.innerHTML += `
                    <div class="tourney-card">
                        <div class="tourney-info">
                            <h2>${t.name}</h2>
                            <p style="color: #a67cff; font-weight: bold;">${t.game} | ${t.format}</p>
                            <p style="font-size: 12px;">Система: ${t.system}</p>
                            ${authorDisplay}
                        </div>
                        <div class="action-area">
                            ${actionButtons}
                        </div>
                    </div>
                `;
            });
        } catch(e) {}
    }

    async function deleteTourney(key) {
        if(confirm("Отменить этот турнир?")) {
            await fetch(dbBase + "tournaments/" + key + ".json", { method: "DELETE" });
            lastTournamentsData = ""; loadTournaments();
        }
    }

    // --- СОЗДАНИЕ ТУРНИРА ---
    function openProposeModal() { document.getElementById("proposeModal").style.display = "flex"; }
    function closeProposeModal() { document.getElementById("proposeModal").style.display = "none"; }
    
    async function sendTourneyProposal() {
        let name = document.getElementById("prop-name").value;
        let game = document.getElementById("prop-game").value; 
        let format = document.getElementById("prop-format").value; 
        let system = document.getElementById("prop-system").value; 
        let prize = document.getElementById("prop-prize").value;
        let rules = document.getElementById("prop-rules").value;

        if (!name) return alert("Напиши название!");
        if (rules.trim().length < 30) return alert("Минимум 30 символов в описании!");
        
        let proposal = { author: currentUser, name: name, game: game, format: format, system: system, prize: prize, rules: rules, date: new Date().toLocaleString() };
        
        if (currentUser === "0m3gas") {
            await fetch(dbBase + "tournaments.json", { method: "POST", body: JSON.stringify(proposal) });
            alert("Опубликовано!");
        } else {
            await fetch(dbBase + "proposals.json", { method: "POST", body: JSON.stringify(proposal) });
            alert("Заявка улетела админу!");
        }
        closeProposeModal();
        
        document.getElementById("prop-name").value = "";
        document.getElementById("prop-rules").value = "";
        lastTournamentsData = ""; loadTournaments();
    }

    loadTournaments();
    setInterval(loadTournaments, 3000);
</script>
</body>
</html>
