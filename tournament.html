<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Cup | Лобби турнира</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        body { background-color: #0b0b0e; color: #e0e0e0; font-family: 'Inter', sans-serif; margin: 0; padding: 0; padding-bottom: 50px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        /* НАВИГАЦИЯ */
        .nav-link { color: #8c8c9b; text-decoration: none; font-size: 14px; transition: 0.3s; display: inline-block; margin: 20px 0; font-weight: bold;}
        .nav-link:hover { color: #a67cff; }

        /* БАННЕР ТУРНИРА (СВЕРХУ) */
        .hero-banner { 
            background: linear-gradient(135deg, #1a1a24 0%, #0b0b0e 100%); 
            border: 1px solid #2a2a35; border-radius: 12px; padding: 40px 30px; 
            margin-bottom: 30px; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-left: 8px solid #a67cff;
            animation: fadeIn 0.4s ease-out;
        }
        /* Декоративное свечение сбоку */
        .hero-banner::after {
            content: ''; position: absolute; top: -50%; right: -50%; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(166,124,255,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%;
        }

        .game-tag { background: #a67cff; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 15px;}
        .tourney-title { font-size: 36px; color: white; margin: 0 0 10px 0; font-weight: 900; line-height: 1.2;}
        .tourney-meta { display: flex; gap: 20px; color: #8c8c9b; font-size: 14px; flex-wrap: wrap;}
        .meta-item { display: flex; align-items: center; gap: 5px; }
        .meta-item strong { color: #00ffcc; }

        /* СЕТКА (ЛЕВО И ПРАВО) */
        .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; animation: fadeIn 0.6s ease-out; }
        @media (max-width: 768px) { .content-grid { grid-template-columns: 1fr; } } /* Для телефонов */

        .card { background: #141419; border: 1px solid #1f1f26; border-radius: 12px; padding: 25px; }
        .card-title { color: white; margin-top: 0; font-size: 18px; border-bottom: 1px solid #2a2a35; padding-bottom: 10px; margin-bottom: 20px; }

        /* ПРАВИЛА */
        .rules-text { color: #e0e0e0; line-height: 1.6; font-size: 15px; white-space: pre-wrap; }

        /* ПАНЕЛЬ УЧАСТИЯ */
        .join-status { text-align: center; margin-bottom: 20px; }
        .join-btn { background: #00ffcc; color: black; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; text-transform: uppercase; box-shadow: 0 5px 15px rgba(0,255,204,0.3);}
        .join-btn:hover { background: white; box-shadow: 0 5px 20px rgba(255,255,255,0.5); transform: translateY(-2px);}
        .join-btn.leave { background: transparent; color: #ff3c64; border: 1px solid #ff3c64; box-shadow: none; }
        .join-btn.leave:hover { background: #ff3c64; color: white; }

        /* СПИСОК ИГРОКОВ */
        .players-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;}
        .player-item { background: #1e1e26; padding: 10px 15px; border-radius: 6px; font-size: 14px; display: flex; align-items: center; gap: 10px;}
        .player-item::before { content: '🎮'; font-size: 12px; }
        .player-item.me { border: 1px solid #00ffcc; color: #00ffcc; font-weight: bold; }
        
        .empty-players { text-align: center; color: #8c8c9b; font-size: 13px; font-style: italic; padding: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-link">← Назад к списку турниров</a>

    <!-- ГЕРОЙСКИЙ БАННЕР -->
    <div class="hero-banner">
        <div class="game-tag" id="t-game">⏳ Загрузка...</div>
        <h1 class="tourney-title" id="t-name">Загрузка турнира...</h1>
        <div class="tourney-meta">
            <div class="meta-item">Организатор: <strong id="t-author" style="color:white;">...</strong></div>
            <div class="meta-item">Призовые: <strong id="t-prize">...</strong></div>
            <div class="meta-item">Участников: <strong id="t-count" style="color:#a67cff;">0</strong></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="content-grid">
        
        <!-- ЛЕВАЯ КОЛОНКА (Правила) -->
        <div class="card">
            <h2 class="card-title">Свод Правил</h2>
            <div class="rules-text" id="t-rules">
                Загрузка правил...
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА (Регистрация и Игроки) -->
        <div>
            <div class="card" style="margin-bottom: 20px; border-color: #00ffcc; box-shadow: 0 5px 20px rgba(0,255,204,0.1);">
                <div class="join-status">
                    <p style="margin-top:0; color:#8c8c9b; font-size:13px;" id="join-text">Регистрация открыта!</p>
                    <button class="join-btn" id="action-btn" onclick="toggleJoin()">Залететь на турнир</button>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">Список участников</h2>
                <div class="players-list" id="players-container">
                    <div class="empty-players">Загрузка игроков...</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const dbBase = "https://retro-cup-51db5-default-rtdb.firebaseio.com/";
    let currentUser = localStorage.getItem("currentUser");

    // МАГИЯ ССЫЛОК: Достаем ID турнира из адресной строки (?id=...)
    const urlParams = new URLSearchParams(window.location.search);
    const tourneyId = urlParams.get('id');

    // Если чувак зашел без ID или не авторизован - выкидываем на главную
    if (!tourneyId || !currentUser) {
        window.location.href = "index.html";
    }

    let isJoined = false; // Флаг: участвует ли текущий игрок

    async function loadTournamentData() {
        try {
            // 1. Качаем инфу о турнире
            let res = await fetch(dbBase + "tournaments/" + tourneyId + ".json");
            let data = await res.json();

            if (!data) {
                document.getElementById("t-name").innerText = "Турнир не найден или удален";
                return;
            }

            // 2. Вставляем текст на страницу
            document.getElementById("t-game").innerText = data.game;
            document.getElementById("t-name").innerText = data.name;
            
            // Если автор 0m3gas - делаем крутую надпись
            if (data.author === "0m3gas") {
                document.getElementById("t-author").innerHTML = "<span style='color:#ffcc00;'>👑 Retro Cup</span>";
            } else {
                document.getElementById("t-author").innerText = data.author;
            }

            document.getElementById("t-prize").innerText = data.prize ? data.prize : "Фо-фан (Без призовых)";
            document.getElementById("t-rules").innerText = data.rules ? data.rules : "Правила не указаны. Играем по джентльменски.";

            // 3. Рисуем список игроков
            let pContainer = document.getElementById("players-container");
            pContainer.innerHTML = "";
            isJoined = false;
            let pCount = 0;

            if (data.players) {
                let players = Object.keys(data.players);
                pCount = players.length;
                
                players.forEach(p => {
                    if (p === currentUser) isJoined = true; // Мы нашли себя в списке!
                    
                    let meClass = (p === currentUser) ? "me" : "";
                    let meText = (p === currentUser) ? " (Ты)" : "";
                    
                    pContainer.innerHTML += `<div class="player-item ${meClass}">${p}${meText}</div>`;
                });
            }

            if (pCount === 0) {
                pContainer.innerHTML = "<div class='empty-players'>Пока никого нет. Стань первым!</div>";
            }
            
            document.getElementById("t-count").innerText = pCount;

            // 4. Настраиваем кнопку (Участвовать или Покинуть)
            let btn = document.getElementById("action-btn");
            let txt = document.getElementById("join-text");

            if (isJoined) {
                btn.innerText = "✖ Покинуть турнир";
                btn.className = "join-btn leave";
                txt.innerText = "Ты успешно зарегистрирован!";
                txt.style.color = "#00ffcc";
            } else {
                btn.innerText = "Залететь на турнир";
                btn.className = "join-btn";
                txt.innerText = "Регистрация открыта!";
                txt.style.color = "#8c8c9b";
            }

        } catch (e) {
            console.log("Ошибка загрузки", e);
        }
    }

    // ФУНКЦИЯ КНОПКИ: Зайти или Выйти
    async function toggleJoin() {
        let btn = document.getElementById("action-btn");
        btn.innerText = "Обработка...";
        btn.disabled = true;

        if (isJoined) {
            // Выходим из турнира (Удаляем свой ник из папки players)
            await fetch(dbBase + "tournaments/" + tourneyId + "/players/" + currentUser + ".json", { method: "DELETE" });
        } else {
            // Заходим (Записываем свой ник со временем)
            let joinData = { time: new Date().toLocaleTimeString() };
            await fetch(dbBase + "tournaments/" + tourneyId + "/players/" + currentUser + ".json", { method: "PUT", body: JSON.stringify(joinData) });
        }

        btn.disabled = false;
        loadTournamentData(); // Перерисовываем страницу мгновенно
    }

    // Грузим данные при входе и каждые 3 секунды
    loadTournamentData();
    setInterval(loadTournamentData, 3000);

</script>

</body>
</html>
