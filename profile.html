<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТУРИКИ | Мой Профиль</title>
    <style>
        /* НОВЫЙ СТИЛЬ SENKU.ONE */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body { 
            background-color: #0b0b0e; /* Глубокий темный цвет фона */
            color: #e0e0e0; 
            font-family: 'Inter', sans-serif; /* Современный гладкий шрифт */
            margin: 0; 
            padding: 20px; 
        }
        
        .container { 
            max-width: 700px; 
            margin: 0 auto; 
        }

        /* Навигация */
        .nav-link {
            color: #8c8c9b;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
            display: inline-block;
            margin-bottom: 20px;
        }
        .nav-link:hover { color: #a67cff; }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
        }
        
        h1 { 
            color: #ffffff; 
            margin: 0; 
            font-size: 28px;
            font-weight: 900;
        }

        .logout-btn { 
            background: rgba(255, 60, 100, 0.1); 
            color: #ff3c64; 
            border: 1px solid rgba(255, 60, 100, 0.3); 
            padding: 8px 16px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: bold;
            transition: 0.3s;
        }
        .logout-btn:hover { background: #ff3c64; color: white; }
        
        /* Карточки профиля (Стиль аниме-сайтов) */
        .profile-card { 
            background: #141419; 
            padding: 25px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #1f1f26;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        h2 { margin-top: 0; font-size: 18px; color: #a67cff; }
        .info-row { font-size: 16px; display: flex; flex-direction: column; gap: 8px;}
        .steam-value { font-size: 24px; font-weight: bold; color: white;}
        
        .edit-btn { 
            background: #a67cff; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            cursor: pointer; 
            font-size: 13px; 
            border-radius: 6px; 
            width: max-content;
            transition: 0.2s;
        }
        .edit-btn:hover { background: #915eff; transform: translateY(-2px);}
        
        .btn { 
            background: #23232b; 
            color: white; 
            border: 1px solid #33333d; 
            padding: 15px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold; 
            border-radius: 8px;
            text-decoration: none; 
            display: block; 
            text-align: center; 
            box-sizing: border-box;
            transition: 0.3s;
        }
        .btn:hover { background: #a67cff; border-color: #a67cff; color: white; }
        
        /* --- НОВОЕ: ВСПЛЫВАЮЩЕЕ ОКНО (МОДАЛКА) --- */
        .modal-overlay {
            display: none; /* Скрыто по умолчанию */
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); /* Темный полупрозрачный фон */
            backdrop-filter: blur(5px); /* Размытие заднего фона */
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #141419;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #2a2a35;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(166, 124, 255, 0.2);
        }
        .modal-box h3 { margin-top: 0; color: white; }
        .modal-input {
            width: 100%; padding: 12px; margin: 15px 0;
            background: #0b0b0e; color: white; border: 1px solid #333;
            border-radius: 8px; box-sizing: border-box; font-size: 16px;
            text-align: center;
        }
        .modal-input:focus { outline: none; border-color: #a67cff; }
        
        .modal-buttons { display: flex; gap: 10px; }
        .btn-save { flex: 1; background: #a67cff; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold;}
        .btn-cancel { flex: 1; background: transparent; color: #8c8c9b; border: 1px solid #333; padding: 10px; border-radius: 6px; cursor: pointer;}
        .btn-save:hover { background: #915eff; }
        .btn-cancel:hover { background: #23232b; color: white; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="nav-link">← Вернуться на главную</a>
    
    <header>
        <h1 id="welcome-text">Профиль</h1>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </header>

    <div class="profile-card">
        <h2>Мой Аккаунт</h2>
        <div class="info-row">
            <span style="color: #8c8c9b; font-size: 14px;">Steam ID (Код дружбы):</span>
            <span id="display-steam" class="steam-value">⏳ Загрузка...</span> 
            <button class="edit-btn" onclick="openModal()">Изменить код</button>
        </div>
    </div>

    <div class="profile-card" style="border: 1px solid rgba(255, 60, 100, 0.3);">
        <h2 style="color: #ff3c64;">Активный матч</h2>
        <p style="color: #8c8c9b; font-size: 14px;">Сейчас у тебя нет активных игр.</p>
        <a href="bracket.html" class="btn">Сетка последнего турнира</a>
    </div>
</div>

    <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
    
<script>
    const dbUsersUrl = "https://retro-cup-51db5-default-rtdb.firebaseio.com/users/";
    let currentUser = localStorage.getItem("currentUser");

    if (!currentUser) {
        window.location.href = "auth.html";
    } else {
        document.getElementById("welcome-text").innerText = currentUser;
        loadUserData(); 
    }

    async function loadUserData() {
        try {
            let response = await fetch(dbUsersUrl + currentUser + ".json");
            let data = await response.json();
            
            // Загрузка Steam ID
            if (data && data.steamCode) {
                document.getElementById("display-steam").innerText = data.steamCode;
            } else {
                document.getElementById("display-steam").innerText = "Не указан";
            }

            // ЗАГРУЗКА АВАТАРКИ
            if (data && data.avatar) {
                document.getElementById("profile-avatar").src = data.avatar;
            }
        } catch(e) {
            document.getElementById("display-steam").innerText = "Ошибка загрузки";
        }
    }

    // --- НОВАЯ ФУНКЦИЯ ДЛЯ ЗАГРУЗКИ АВАТАРКИ ---
    async function uploadAvatar(event) {
        let file = event.target.files[0];
        if (!file) return;

        // Ограничиваем вес файла до 800 КБ, чтобы база Firebase не перегружалась
        if (file.size > 800 * 1024) { 
            alert("Файл слишком большой! Выберите картинку весом до 800 КБ.");
            return;
        }

        let reader = new FileReader();
        reader.onload = async function(e) {
            let base64Image = e.target.result; // Конвертируем картинку в текст (Base64)
            
            // Сразу отображаем новую картинку на экране
            document.getElementById("profile-avatar").src = base64Image;

            // Сохраняем в Firebase
            try {
                await fetch(dbUsersUrl + currentUser + ".json", {
                    method: "PATCH",
                    body: JSON.stringify({ avatar: base64Image })
                });
            } catch(err) {
                alert("Ошибка при сохранении аватарки в базу данных!");
            }
        };
        reader.readAsDataURL(file); // Запускаем процесс чтения файла
    }

    // --- ЛОГИКА ВСПЛЫВАЮЩЕГО ОКНА (STEAM CODE) ---
    function openModal() {
        document.getElementById("steamModal").style.display = "flex";
        // Подставляем текущий код в поле ввода
        let currentCode = document.getElementById("display-steam").innerText;
        if(currentCode !== "⏳ Загрузка..." && currentCode !== "Не указан") {
            document.getElementById("newSteamInput").value = currentCode;
        }
    }

    function closeModal() {
        document.getElementById("steamModal").style.display = "none";
    }

    async function confirmSteamChange() {
        let newSteam = document.getElementById("newSteamInput").value;
        
        if (newSteam.trim() === "") {
            alert("Поле не может быть пустым!");
            return;
        }

        let btn = document.getElementById("saveBtn");
        btn.innerText = "Загрузка...";
        btn.disabled = true;

        try {
            await fetch(dbUsersUrl + currentUser + ".json", {
                method: "PATCH",
                body: JSON.stringify({ steamCode: newSteam.trim() })
            });
            
            document.getElementById("display-steam").innerText = newSteam.trim();
            closeModal(); // Закрываем красивое окошко
        } catch (e) {
            alert("❌ Ошибка соединения с базой!");
        }
        
        btn.innerText = "Сохранить";
        btn.disabled = false;
    }

    function logout() {
        localStorage.removeItem("currentUser");
        window.location.href = "index.html";
    }
</script>
</body>
</html>
