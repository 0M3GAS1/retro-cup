<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ТУРИКИ | Профиль Игрока</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid #00ffcc; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px #00ffcc; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        h1, h2 { color: #00ffcc; margin: 0;}
        .logout-btn { background: #ff0055; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-weight: bold;}
        
        .btn { background: #9d00ff; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; text-decoration: none; display: block; text-align: center; box-sizing: border-box;}
        .match-zone { border: 2px dashed #ff0055; padding: 20px; text-align: center; background: #2a0011; border-radius: 5px; margin-top: 20px;}
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="color: #aaa; text-decoration: none;">⬅ На главную</a>
    
    <header style="margin-top: 15px;">
        <!-- Сюда подставится ник игрока -->
        <h1 id="welcome-text">ТВОЙ ПРОФИЛЬ</h1>
        <button class="logout-btn" onclick="logout()">ВЫЙТИ 🚪</button>
    </header>

    <div class="match-zone">
        <h3 style="color: #ff0055; margin-top: 0;">⚡ ТЕКУЩИЙ МАТЧ ⚡</h3>
        <p><strong>Dota 2 | 1v1 Mid</strong></p>
        <p>Твой соперник: <span style="color:#00ffcc;">Dendi_Fan_99</span></p>
        
        <a href="bracket.html" class="btn" style="background: #333; margin-bottom: 15px; border: 1px solid #555;">👀 ПОСМОТРЕТЬ СЕТКУ ТУРНИРА</a>
        
        <div style="text-align: left; margin-top: 15px;">
            <label style="color: #aaa; font-size: 14px;">Загрузить скриншот победы:</label><br>
            <input type="file" accept="image/png, image/jpeg" style="margin-top: 5px;">
        </div>
        <button class="btn" onclick="alert('Функция отправки фото будет добавлена позже!')">ОТПРАВИТЬ РЕЗУЛЬТАТ</button>
    </div>
</div>

<script>
    // 1. ПРОВЕРЯЕМ, КТО ВОШЕЛ
    let currentUser = localStorage.getItem("currentUser");

    // Если чувак не вошел в аккаунт, но как-то попал на эту страницу по ссылке - выгоняем его!
    if (!currentUser) {
        window.location.href = "auth.html";
    } else {
        // Если вошел - пишем его ник
        document.getElementById("welcome-text").innerText = "ПРОФИЛЬ: " + currentUser;
    }

    // 2. ФУНКЦИЯ ВЫХОДА
    function logout() {
        localStorage.removeItem("currentUser"); // Удаляем память
        window.location.href = "index.html"; // Выкидываем на главную
    }
</script>

</body>
</html>
