<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ТУРИКИ | Мой Профиль</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; border: 2px solid #00ffcc; padding: 20px; border-radius: 10px; box-shadow: 0 0 15px #00ffcc; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        h1, h2 { color: #00ffcc; margin: 0;}
        .logout-btn { background: #ff0055; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-weight: bold;}
        .profile-card { background: #1e1e1e; padding: 20px; border-radius: 5px; margin-bottom: 20px; border-left: 5px solid #9d00ff; }
        .info-row { margin-bottom: 10px; font-size: 16px; }
        .edit-btn { background: #333; color: #00ffcc; border: 1px solid #00ffcc; padding: 3px 8px; cursor: pointer; font-size: 12px; border-radius: 3px; margin-left: 10px;}
        .edit-btn:hover { background: #00ffcc; color: black; }
        .btn { background: #9d00ff; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; text-decoration: none; display: block; text-align: center; box-sizing: border-box;}
        .btn:hover { background: #b84dff; }
        .match-zone { border: 2px dashed #ff0055; padding: 20px; text-align: center; background: #2a0011; border-radius: 5px;}
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" style="color: #aaa; text-decoration: none;">⬅ На главную</a>
    
    <header style="margin-top: 15px;">
        <h1 id="welcome-text">ПРОФИЛЬ</h1>
        <button class="logout-btn" onclick="logout()">ВЫЙТИ 🚪</button>
    </header>

    <div class="profile-card">
        <h2 style="margin-bottom: 15px;">Мои данные</h2>
        <div class="info-row">
            <span style="color: #aaa;">Steam ID (Код дружбы):</span><br>
            <strong id="display-steam" style="font-size: 20px;">⏳ Загрузка...</strong> 
            <button class="edit-btn" onclick="changeSteam()">✏️ Изменить</button>
        </div>
    </div>

    <div class="profile-card" style="border-left-color: #00ffcc;">
        <h2 style="margin-bottom: 15px;">Мои турниры</h2>
        <div id="tournaments-history">
            <p style="color: #aaa; font-style: italic;">Ты пока не участвовал ни в одном турнире. Время это исправить, бро!</p>
        </div>
    </div>

    <div class="match-zone">
        <h3 style="color: #ff0055; margin-top: 0;">⚡ АКТИВНЫЙ МАТЧ ⚡</h3>
        <p style="color: #aaa;">Сейчас у тебя нет активных игр.</p>
        <a href="bracket.html" class="btn" style="background: #333; margin-bottom: 0; border: 1px solid #555;">👀 ПОСМОТРЕТЬ СЕТКУ ПОСЛЕДНЕГО ТУРНИРА</a>
    </div>
</div>

<script>
    const dbUsersUrl = "https://retro-cup-51db5-default-rtdb.firebaseio.com/users/";
    let currentUser = localStorage.getItem("currentUser");

    if (!currentUser) {
        window.location.href = "auth.html";
    } else {
        document.getElementById("welcome-text").innerText = currentUser;
        loadUserData(); 
    }

    async function loadUserData() {
        try {
            let response = await fetch(dbUsersUrl + currentUser + ".json");
            let data = await response.json();
            
            if (data && data.steamCode) {
                document.getElementById("display-steam").innerText = data.steamCode;
            } else {
                document.getElementById("display-steam").innerText = "Не указан";
            }
        } catch(e) {
            document.getElementById("display-steam").innerText = "Ошибка загрузки";
        }
    }

    async function changeSteam() {
        let newSteam = prompt("Введи свой правильный код дружбы Steam (ТОЛЬКО ЦИФРЫ):");
        
        if (!newSteam || newSteam.trim() === "") return;

        // --- НОВАЯ ЗАЩИТА ОТ ДУРАКА ---
        // Проверяем, состоит ли строка ТОЛЬКО из цифр
        if (!/^\d+$/.test(newSteam.trim())) {
            alert("❌ Ошибка! Код дружбы может состоять ТОЛЬКО ИЗ ЦИФР. Никаких букв или пробелов!");
            return; // Прерываем работу, код не сохранится
        }
        // ------------------------------

        document.getElementById("display-steam").innerText = "Обновление...";

        try {
            await fetch(dbUsersUrl + currentUser + ".json", {
                method: "PATCH",
                body: JSON.stringify({ steamCode: newSteam.trim() })
            });
            document.getElementById("display-steam").innerText = newSteam.trim();
            alert("✅ Твой Steam ID успешно изменен!");
        } catch (e) {
            alert("❌ Ошибка соединения с базой!");
            loadUserData(); 
        }
    }

    function logout() {
        localStorage.removeItem("currentUser");
        window.location.href = "index.html";
    }
</script>

</body>
</html>
