<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ТУРИКИ | Вход в систему</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh;}
        .auth-container { width: 100%; max-width: 400px; background: #1e1e1e; border: 2px solid #9d00ff; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px #9d00ff; }
        h2 { color: #00ffcc; text-align: center; margin-top: 0; }
        .input-group { margin-bottom: 15px; }
        label { display: block; color: #aaa; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 10px; background: #121212; color: white; border: 1px solid #555; box-sizing: border-box; font-family: monospace; }
        .btn { background: #9d00ff; color: white; border: none; padding: 12px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #b84dff; }
        
        .switch-text { text-align: center; margin-top: 20px; font-size: 14px; color: #aaa; }
        .switch-text span { color: #00ffcc; cursor: pointer; text-decoration: underline; }
        
        #register-form { display: none; }
    </style>
</head>
<body>

<div class="auth-container">
    
    <div id="login-form">
        <h2>АВТОРИЗАЦИЯ</h2>
        <div class="input-group">
            <label>Никнейм:</label>
            <input type="text" id="log-nick" placeholder="Введи свой ник">
        </div>
        <div class="input-group">
            <label>Пароль:</label>
            <input type="password" id="log-pass" placeholder="Введи пароль">
        </div>
        <button class="btn" onclick="login()">ВОЙТИ</button>
        <div class="switch-text">Нет аккаунта? <span onclick="toggleForms()">Создать!</span></div>
        <a href="index.html" style="display:block; text-align:center; color:#555; text-decoration:none; margin-top:20px; font-size: 14px;">⬅ На главную</a>
    </div>

    <div id="register-form">
        <h2 style="color: #ff0055;">РЕГИСТРАЦИЯ</h2>
        <div class="input-group">
            <label>Придумай Никнейм:</label>
            <input type="text" id="reg-nick" placeholder="Он будет виден всем">
        </div>
        <div class="input-group">
            <label>Код дружбы Steam (ТОЛЬКО ЦИФРЫ):</label>
            <!-- МАГИЯ ТУТ: oninput стирает все буквы прямо во время печатания -->
            <input type="text" id="reg-steam" placeholder="Например: 123456789" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
        <div class="input-group">
            <label>Придумай Пароль:</label>
            <input type="password" id="reg-pass" placeholder="Секретный пароль">
        </div>
        <button class="btn" style="background: #ff0055;" onclick="register()">СДЕЛАТЬ АККАУНТ</button>
        <div class="switch-text">Уже есть аккаунт? <span onclick="toggleForms()">Войти</span></div>
        <a href="index.html" style="display:block; text-align:center; color:#555; text-decoration:none; margin-top:20px; font-size: 14px;">⬅ На главную</a>
    </div>

</div>

<script>
    const dbBaseUrl = "https://retro-cup-51db5-default-rtdb.firebaseio.com/users/";

    function toggleForms() {
        let loginF = document.getElementById("login-form");
        let regF = document.getElementById("register-form");
        if (loginF.style.display === "none") {
            loginF.style.display = "block";
            regF.style.display = "none";
        } else {
            loginF.style.display = "none";
            regF.style.display = "block";
        }
    }

    async function register() {
        let nick = document.getElementById("reg-nick").value;
        let steam = document.getElementById("reg-steam").value;
        let pass = document.getElementById("reg-pass").value;

        if (nick === "" || pass === "" || steam === "") return alert("Заполни все поля!");

        let checkUrl = dbBaseUrl + nick + ".json";
        let response = await fetch(checkUrl);
        let data = await response.json();

        if (data !== null) {
            alert("❌ Братан, этот ник уже занят! Придумай другой.");
            return;
        }

        let newUser = {
            password: pass, 
            steamCode: steam,
            regDate: new Date().toLocaleString()
        };

        await fetch(checkUrl, {
            method: "PUT",
            body: JSON.stringify(newUser)
        });

        alert("✅ Аккаунт успешно создан! Теперь ты можешь войти.");
        toggleForms(); 
    }

    async function login() {
        let nick = document.getElementById("log-nick").value;
        let pass = document.getElementById("log-pass").value;

        if (nick === "" || pass === "") return alert("Введи ник и пароль!");

        let checkUrl = dbBaseUrl + nick + ".json";
        let response = await fetch(checkUrl);
        let data = await response.json();

        if (data === null) {
            alert("❌ Такого пользователя не существует!");
            return;
        }

        if (data.password === pass) {
            localStorage.setItem("currentUser", nick);
            window.location.href = "profile.html";
        } else {
            alert("❌ Неверный пароль!");
        }
    }
</script>

</body>
</html>
